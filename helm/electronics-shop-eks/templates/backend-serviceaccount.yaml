# ServiceAccount riêng cho backend — KHÔNG dùng "default" ServiceAccount của
# namespace nữa. Annotation "eks.amazonaws.com/role-arn" là thứ IRSA dựa vào
# để cấp credentials tạm thời cho pod (xem Bước 6 — OIDC + IRSA). Tên
# ServiceAccount này PHẢI khớp chính xác với điều kiện "sub" trong trust
# policy của role, dạng:
#   system:serviceaccount:<namespace>:<tên-serviceaccount-này>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.backend.name }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.backend.roleArn | quote }}