# Giống backend-serviceaccount.yaml, nhưng gắn role read-only S3
# (techshop-s3-frontend-read-policy) — frontend chỉ cần GetObject để phục vụ
# route /api/images/[...key], không có quyền ghi/xoá gì cả.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.frontend.name }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.frontend.roleArn | quote }}