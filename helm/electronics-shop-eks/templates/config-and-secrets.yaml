apiVersion: v1
kind: ConfigMap
metadata:
  name: electronics-shop-config
  namespace: {{ .Values.global.namespace }}
data:
  PORT: "{{ .Values.backend.port }}"
  NODE_ENV: "{{ .Values.backend.env.nodeEnv }}"
  JWT_EXPIRES_IN: "{{ .Values.backend.env.jwtExpiresIn }}"
  FRONTEND_URL: "{{ .Values.backend.env.frontendUrl }}"
  STORAGE_PROVIDER: "{{ .Values.backend.env.storageProvider }}"
  AWS_REGION: "{{ .Values.s3.region }}"
  AWS_S3_BUCKET: "{{ .Values.s3.bucket }}"
  # Bật nhánh đọc DB credentials qua Secrets Manager trong
  # backend/src/config/configuration.ts — khi KHÔNG set biến này (chart local
  # k3s cũ), code tự dùng nhánh DB_HOST/DB_PASSWORD như trước, không đổi gì.
  DB_CREDENTIALS_SOURCE: "secrets-manager"
  DB_SECRET_ARN: "{{ .Values.secretsManager.dbSecretArn }}"
  # DB_HOST/DB_PORT/DB_NAME dưới đây chỉ để tham khảo/debug — khi
  # DB_CREDENTIALS_SOURCE=secrets-manager, code LUÔN ưu tiên giá trị lấy từ
  # Secrets Manager (secret JSON có sẵn host/port/dbname), không đọc 3 dòng
  # này nữa, nhưng vẫn khai ở ConfigMap để ai đọc YAML cũng biết RDS đang trỏ đâu.
  DB_HOST: "{{ .Values.rds.host }}"
  DB_PORT: "{{ .Values.rds.port }}"
  DB_NAME: "{{ .Values.rds.database }}"
---
# Secret riêng cho dữ liệu nhạy cảm còn lại. Đã bỏ DB_PASSWORD/MINIO_* khỏi
# đây — RDS password lấy qua AWS Secrets Manager (IRSA), S3 credentials lấy
# qua IRSA — không còn secret dạng plaintext nào cho DB/storage nữa.
apiVersion: v1
kind: Secret
metadata:
  name: electronics-shop-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  JWT_SECRET: "{{ .Values.secrets.jwtSecret }}"