apiVersion: v1
kind: ConfigMap
metadata:
  name: electronics-shop-config
  namespace: {{ .Values.global.namespace }}
data:
  PORT: "{{ .Values.backend.port }}"
  NODE_ENV: "{{ .Values.backend.env.nodeEnv }}"
  JWT_EXPIRES_IN: "{{ .Values.backend.env.jwtExpiresIn }}"
  FRONTEND_URL: "{{ .Values.backend.env.frontendUrl }}"
  STORAGE_PROVIDER: "{{ .Values.backend.env.storageProvider }}"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "{{ .Values.postgres.database }}"
  DB_USERNAME: "{{ .Values.postgres.username }}"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET: "{{ .Values.minio.bucket }}"
---
# Secret riêng cho dữ liệu nhạy cảm. Đây là bản DEMO dùng Values (base64 tự động
# qua Helm) — khi lên EKS nên thay bằng External Secrets Operator + AWS Secrets
# Manager, hoặc Vault Agent Injector (đúng như hình kiến trúc "HashiCorp Vault ->
# Get Secret"), thay vì lưu thẳng trong values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: electronics-shop-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  JWT_SECRET: "{{ .Values.secrets.jwtSecret }}"
  DB_PASSWORD: "{{ .Values.secrets.postgresPassword }}"
  MINIO_ACCESS_KEY: "{{ .Values.secrets.minioAccessKey }}"
  MINIO_SECRET_KEY: "{{ .Values.secrets.minioSecretKey }}"
