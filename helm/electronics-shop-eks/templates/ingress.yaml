# (KHÁC bản Traefik/k3s) Ingress gốc chỉ còn route cho MinIO, vì "/" và
# "/api" được 2 IngressRoute (CRD Traefik) đảm nhiệm để chia % canary — CRD
# đó không tồn tại trên EKS. Ingress này giờ là nơi DUY NHẤT khai route,
# dùng ingressClassName "alb" (AWS Load Balancer Controller, xem Bước 9) và
# trỏ thẳng vào *-stable Service (không chia % — xem lưu ý trafficRouting
# trong templates/backend.yaml).
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: electronics-shop
  namespace: {{ .Values.global.namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.alb.scheme }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.alb.targetType }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Gộp chung 1 ALB với ArgoCD/Argo Rollouts Dashboard/Prometheus/
    # Alertmanager/Grafana (xem argo/argocd-server-values-eks.yaml,
    # argo/argo-rollouts-values-eks.yaml,
    # monitoring/kube-prometheus-stack-values-eks.yaml — cùng gắn đúng
    # group.name này). Không gắn thì AWS Load Balancer Controller tạo
    # MỖI Ingress 1 ALB riêng (tốn thêm chi phí, và không test được đúng
    # cảnh 1 ALB route nhiều Host).
    alb.ingress.kubernetes.io/group.name: techshop-shared
    # Bỏ comment khi đã có ACM certificate để bật HTTPS:
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Ngoại lệ của route "/api": /api/images do frontend xử lý,
          # nên phải khai báo riêng trước route /api để không bị chuyển vào backend.
          - path: /api/images
            pathType: Prefix
            backend:
              service: { name: frontend-stable, port: { number: {{ .Values.frontend.port }} } }
          # Đặt "/api" TRƯỚC "/" — Ingress dùng first-match, "/" (Prefix) sẽ
          # nuốt luôn "/api" nếu khai sau, khiến traffic API bị route nhầm
          # vào frontend.
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend-stable, port: { number: {{ .Values.backend.port }} } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend-stable, port: { number: {{ .Values.frontend.port }} } }
{{- end }}