# File này từng bị XOÁ khi chuyển app sang ALB Ingress Controller
# vì CRD "TraefikService"/"IngressRoute" không tồn tại trên EKS nếu không tự cài
# thêm Traefik. Giờ Traefik đã được cài thật trong cluster (xem
# scripts/install-eks-tools.sh).
{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: backend-traefik
  namespace: {{ .Values.global.namespace }}
spec:
  weighted:
    services:
      - name: backend-stable
        port: {{ .Values.backend.port }}
      - name: backend-canary
        port: {{ .Values.backend.port }}
    # KHÔNG khai "weight" ở đây — để Argo Rollouts tự set lúc chạy canary
    # (hàm SetWeight() trong controller LUÔN ghi đè field này mỗi vòng
    # reconcile, bất kể Git khai gì), tránh Argo CD báo OutOfSync giả do so
    # sánh field mà cluster tự đổi ngoài luồng Git.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-canary-route
  namespace: {{ .Values.global.namespace }}
spec:
  # "web" (80) VÀ "websecure" (443) là 2 entrypoint RIÊNG BIỆT của Traefik
  # (xem traefik/traefik-values-eks.yaml) — không tự gộp làm 1. NLB giải mã
  # TLS rồi forward traffic HTTPS thật (cổng 443 ngoài NLB) vào đúng
  # entrypoint "websecure" bên trong Traefik, KHÔNG phải "web". Thiếu
  # "websecure" ở đây, mọi request qua HTTPS (tức qua NLB cổng 443) sẽ không
  # khớp router nào, Traefik trả 404 dù route/service ở dưới hoàn toàn đúng.
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend-traefik
          kind: TraefikService
{{- end }}