apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: {{ .Values.global.namespace }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: electronics-shop-secrets, key: MINIO_ACCESS_KEY }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: electronics-shop-secrets, key: MINIO_SECRET_KEY }
          volumeMounts:
            - { name: miniodata, mountPath: /data }
          resources: {{ toYaml .Values.minio.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: miniodata }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.minio.storageClassName }}
        resources: { requests: { storage: {{ .Values.minio.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.global.namespace }}
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# Job tạo bucket tự động khi triển khai lần đầu (tương đương service "minio-init"
# trong docker-compose.yml)
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: {{ .Values.global.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    # Tự xoá Job của lần chạy trước (nếu có) trước khi tạo Job mới — tránh lỗi
    # "job already exists" và không cần "kubectl delete job" bằng tay nữa.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Tăng backoffLimit + activeDeadlineSeconds làm "lưới an toàn" thứ 2, phòng khi
  # MinIO khởi động chậm bất thường (máy yếu, lần đầu tạo PVC...). Vòng lặp chờ
  # bên dưới mới là cơ chế chính xử lý race-condition.
  # 600s (10 phút) — đủ rộng để chịu được lần cài đầu tiên: kéo image MinIO +
  # image mc, cấp phát PVC, MinIO khởi động lần đầu. Các lần "helm upgrade" sau
  # (image đã cache, MinIO đã chạy sẵn) thường xong trong vài giây, deadline
  # rộng này không ảnh hưởng gì tới tốc độ thực tế.
  backoffLimit: 3
  activeDeadlineSeconds: 180 # Chờ tối đa 3 phút, nếu MinIO chưa sẵn sàng thì Job fail
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Đang chờ MinIO sẵn sàng..."
              until mc alias set local http://minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do
                echo "MinIO chưa sẵn sàng, thử lại sau 3 giây..."
                sleep 3
              done
              echo "MinIO đã sẵn sàng, tạo bucket (bỏ qua nếu đã tồn tại)..."
              mc mb --ignore-existing local/{{ .Values.minio.bucket }} &&
              mc anonymous set download local/{{ .Values.minio.bucket }}
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: electronics-shop-secrets, key: MINIO_ACCESS_KEY }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: electronics-shop-secrets, key: MINIO_SECRET_KEY }
