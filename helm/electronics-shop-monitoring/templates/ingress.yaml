# LƯU Ý: khác với chart gốc, KHÔNG còn rule "path: /" -> Service "frontend"
# ở đây nữa. Route cho host chính (cả "/" lẫn "/api") giờ do 2
# IngressRoute (CRD của Traefik) đảm nhiệm — xem:
#   - templates/frontend-traffic.yaml -> route "/"   -> frontend-traefik
#   - templates/backend-traffic.yaml  -> route "/api" -> backend-traefik
# Lý do: k8s Ingress thường (networking.k8s.io) chỉ trỏ cố định 1 Service,
# không chia % traffic được, nên không dùng được cho canary. Ingress
# resource này giờ chỉ còn giữ lại phần route cho MinIO (không cần canary).
{{- if .Values.ingress.minio.enabled }}
# Ingress riêng cho MinIO — tách host riêng (không dùng path) vì MinIO console
# là 1 ứng dụng web độc lập, đi chung path với app chính dễ xung đột routing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: electronics-shop-minio
  namespace: {{ .Values.global.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # Giao diện web MinIO Console — nơi bạn đăng nhập, xem/tạo bucket, tự tay
    # upload/xoá file để test thủ công.
    - host: {{ .Values.ingress.minio.consoleHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: minio, port: { number: 9001 } }
    # S3 API — nơi app (hoặc trình duyệt qua presigned URL) thật sự gọi để
    # upload/tải file. Cần expose riêng vì backend trả presigned URL trỏ tới
    # đúng host này cho client gọi trực tiếp.
    - host: {{ .Values.ingress.minio.apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: minio, port: { number: 9000 } }
{{- end }}