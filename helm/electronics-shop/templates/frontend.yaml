apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.global.namespace }}
  labels: { app: frontend }
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      containers:
        - name: frontend
          image: {{ include "electronics-shop.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.frontend.port }} }]
          env:
            # gọi sang backend qua tên Service nội bộ K8s, không phải qua Ingress
            - name: INTERNAL_API_URL
              value: "http://backend:{{ .Values.backend.port }}/api/v1"
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.frontend.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{ toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.global.namespace }}
spec:
  selector: { app: frontend }
  ports: [{ port: {{ .Values.frontend.port }}, targetPort: {{ .Values.frontend.port }} }]
