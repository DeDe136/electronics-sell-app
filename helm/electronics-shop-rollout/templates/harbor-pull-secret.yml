{{- if .Values.image.harborAuth.create }}
{{- $server := .Values.image.registry }}
{{- $username := .Values.image.harborAuth.username }}
{{- $password := .Values.image.harborAuth.password }}
{{- $auth := printf "%s:%s" $username $password | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.image.pullSecretName }}
  namespace: {{ .Values.global.namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" $server $username $password $auth | b64enc }}
{{- end }}
