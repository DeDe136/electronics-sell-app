apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: backend-traefik
  namespace: {{ .Values.global.namespace }}
spec:
  weighted:
    services:
      - name: backend-stable    # Service stable (đổi tên từ "backend")
        port: {{ .Values.backend.port }}
      - name: backend-canary    # Service canary
        port: {{ .Values.backend.port }}
    # KHÔNG khai "weight" ở đây — để Argo Rollouts tự set lúc chạy canary
    # (hàm SetWeight() trong controller LUÔN ghi đè field này mỗi vòng
    # reconcile, bất kể Git khai gì), tránh Argo CD báo OutOfSync giả do so
    # sánh field mà cluster tự đổi ngoài luồng Git (giống lưu ý bên phần backend Deployment
    # cũ với HPA).
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-canary-route
  namespace: {{ .Values.global.namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend-traefik
          kind: TraefikService