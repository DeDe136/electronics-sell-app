apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: backend-traefik
  namespace: {{ .Values.global.namespace }}
spec:
  weighted:
    services:
      - name: backend           # Service stable
        port: {{ .Values.backend.port }}
      - name: backend-canary    # Service canary
        port: {{ .Values.backend.port }}
    # KHÔNG khai "weight" ở đây — để Argo Rollouts tự set lúc chạy canary,
    # tránh Argo CD báo OutOfSync (giống lưu ý bên phần backend Deployment
    # cũ với HPA).
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-canary-route
  namespace: {{ .Values.global.namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend-traefik
          kind: TraefikService