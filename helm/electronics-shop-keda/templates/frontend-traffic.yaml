{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: frontend-traefik
  namespace: {{ .Values.global.namespace }}
spec:
  weighted:
    services:
      - name: frontend-stable    # Service stable
        port: {{ .Values.frontend.port }}
      - name: frontend-canary    # Service canary
        port: {{ .Values.frontend.port }}
    # KHÔNG khai "weight" ở đây — Argo Rollouts tự set lúc chạy canary
    # (xem giải thích trong templates/backend-traffic.yaml).
---
# Route "/" của host chính vào frontend-traefik — THAY THẾ cho rule
# "path: /" từng khai trong k8s Ingress thường (networking.k8s.io) ở chart
# gốc. Lý do phải chuyển hẳn qua IngressRoute: k8s Ingress chỉ trỏ tới
# ĐÚNG 1 Service cố định, không có khái niệm chia % traffic — nên traffic
# browser thật sẽ luôn 100% vào bản stable, không phản ánh đúng % canary
# đang chạy (khác với traffic SSR nội bộ đã hairpin qua Traefik từ trước,
# xem templates/frontend.yaml). Đổi sang IngressRoute + TraefikService để
# traffic browser cũng được chia weight y hệt, đồng bộ với cách backend
# đang làm.
#
# PathPrefix(`/`) match MỌI path, kể cả "/api/*" — nhưng Traefik tự ưu
# tiên rule có path càng dài/cụ thể càng cao (không cần khai "priority"
# bằng tay), nên IngressRoute "backend-canary-route"
# (Host + PathPrefix(`/api`)) trong templates/backend-traffic.yaml vẫn
# luôn thắng route này cho các request /api/*. Route này chỉ thực sự nhận
# phần còn lại (trang web, asset tĩnh...).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-canary-route
  namespace: {{ .Values.global.namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: frontend-traefik
          kind: TraefikService
{{- end }}