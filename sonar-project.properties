# =============================================================================
# SONAR-PROJECT.PROPERTIES
# -----------------------------------------------------------------------------
# File cấu hình cho SonarQube/SonarCloud Scanner. Đặt ở thư mục gốc repo vì
# dự án là "Modular Monolith" gồm 2 workspace (backend NestJS + frontend
# Next.js) nhưng được quét CHUNG trong 1 project Sonar để có 1 dashboard
# duy nhất, thay vì tạo 2 project riêng biệt.
# =============================================================================

# --- Định danh project trên SonarQube server (phải khớp với project đã tạo
# trên UI, hoặc Sonar sẽ tự tạo mới nếu server cho phép) ---
sonar.projectKey=DeDe136_electronics-sell-app
sonar.organization=dede136
sonar.projectName=electronics-sell-app
sonar.projectVersion=1.0.0

# --- Thư mục chứa mã nguồn cần phân tích ---
# Gộp cả 2 workspace vì đây là monorepo. Sonar sẽ tự nhận diện ngôn ngữ
# (TypeScript) dựa theo phần mở rộng file .ts/.tsx.
sonar.sources=backend/src,frontend/app,frontend/components,frontend/lib

# --- Thư mục chứa test (để Sonar phân biệt code test vs code production,
# tránh tính điểm coverage/duplication sai) ---
# Gồm cả backend (NestJS, *.spec.ts) lẫn frontend (React/Next.js, *.test.tsx)
# để Sonar quét test coverage của CẢ 2 workspace, không chỉ backend như trước.
sonar.tests=backend/src,frontend/app,frontend/components,frontend/lib

# Pattern để Sonar tự nhận diện file nào là test trong sonar.tests ở trên
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx

# --- Loại trừ khỏi phân tích: file build, thư viện bên thứ 3, file cấu hình
# tự sinh — quét các thư mục này vừa tốn thời gian vừa không có giá trị ---
# Lưu ý: *.spec.ts / *.test.ts / *.test.tsx bị loại khỏi "sources" ở đây vì
# chúng đã được khai báo riêng là "tests" qua sonar.tests + sonar.test.inclusions
# ở trên — nếu không loại trừ, Sonar sẽ tính test code React (.test.tsx) như
# code sản xuất và áp sai rule/coverage.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/coverage/**,**/*.d.ts,frontend/public/**

# Loại trừ riêng cho tính năng "Duplication" — bỏ file migration tự sinh
# (TypeORM) vì các file này thường có cấu trúc lặp lại tự nhiên, không phải
# code smell thực sự.
sonar.cpd.exclusions=**/migrations/**,**/*.entity.ts

# Loại trừ riêng khỏi phép tính "Coverage" (KHÔNG loại khỏi phân tích bug/
# code smell — file vẫn được Sonar quét lỗi bình thường, chỉ không bắt buộc
# phải có test). Áp dụng cho seed script (backend/src/database/seeds/**):
# đây là script chạy 1 lần để tạo dữ liệu mẫu cho môi trường dev/staging,
# không phải logic nghiệp vụ chạy trong request thật — viết unit test cho
# seed chỉ để "cho có coverage" không mang lại giá trị thực, lại tốn công
# maintain mỗi khi đổi dữ liệu mẫu.
sonar.coverage.exclusions=backend/src/database/seeds/**

# --- Đường dẫn tới coverage report (định dạng LCOV) do Jest sinh ra khi
# chạy "npm run test:cov" ở CẢ backend lẫn frontend — Sonar đọc các file này
# để hiển thị % coverage trên dashboard cho cả 2 workspace. Nếu file không
# tồn tại, Sonar chỉ bỏ qua phần coverage tương ứng chứ không làm fail scan. ---
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# --- Ngôn ngữ chính của project (giúp Sonar chọn đúng bộ rule mặc định) ---
sonar.sourceEncoding=UTF-8

# --- Với các module TypeScript, cần trỏ tsconfig để Sonar type-check
# chính xác hơn khi phân tích (đặc biệt là NestJS decorator, generic types) ---
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json
