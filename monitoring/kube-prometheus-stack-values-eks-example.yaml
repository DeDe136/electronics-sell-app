## monitoring/kube-prometheus-stack-values-eks-example.yaml
##
## File MẪU (example) — commit lên Git bình thường, KHÔNG chứa giá trị thật.
## Trước khi deploy, copy thành "kube-prometheus-stack-values-eks.yaml" (đã
## thêm vào .gitignore) rồi điền giá trị thật vào bản copy đó — KHÔNG sửa
## trực tiếp file này. Các chỗ cần điền: adminPassword của Grafana, email
## gửi/nhận cảnh báo của Alertmanager (tìm "REPLACE_ME" / "changeme"), ingress.hosts.
##
##   cp monitoring/kube-prometheus-stack-values-eks-example.yaml \
##      monitoring/kube-prometheus-stack-values-eks.yaml
##   # ... điền giá trị thật vào file vừa copy ...
##
## QUAN TRỌNG: storageClassName đổi từ "local-path" (chỉ có trên K3s) sang
## "gp3" — StorageClass này KHÔNG tự có sẵn trên EKS, cần cài EBS CSI Driver
## + tạo StorageClass "gp3" trước (xem scripts/install-eks-tools.sh, phần
## cài EBS CSI Driver). Nếu chưa cài, "helm install" bằng file này sẽ treo
## ở trạng thái Pod "Pending" (PVC không bao giờ được bind).

# --- Tắt 4 component "control plane" — LÝ DO Ở EKS KHÁC HẲN K3s ---
# Ở K3s, các component này chạy chung 1 binary trên chính node của bạn,
# chỉ là không expose đúng kiểu chart kỳ vọng (endpoint/port khác).
# Ở EKS, "kubeControllerManager"/"kubeScheduler"/"kubeEtcd" chạy hoàn toàn
# trong hạ tầng AWS quản lý, NẰM NGOÀI account/VPC của bạn — không có Node
# nào trong cluster của bạn chạy 3 thứ này cả, nên KHÔNG THỂ bật lên được
# dù có config đúng cỡ nào — đây là giới hạn cứng của EKS, không phải thiếu
# cấu hình. Giữ enabled: false là bắt buộc, không phải tuỳ chọn.
#
# "kubeProxy" thì khác 1 chút — trên EKS nó VẪN chạy dạng DaemonSet ngay
# trong cluster của bạn (kubectl get pods -n kube-system -l k8s-app=kube-proxy
# sẽ thấy), nhưng mặc định port metrics chỉ bind vào 127.0.0.1 (không tự
# scrape được từ ngoài) — muốn bật thật phải sửa thêm ConfigMap
# "kube-proxy-config" (đổi metricBindAddress thành "0.0.0.0:10249"), việc
# này được xem là không cần thiết. Để enabled: false cho đơn giản, coi như
# chưa cần theo dõi riêng kube-proxy (đã có metrics tổng quan qua
# node-exporter + cAdvisor rồi).
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
# kubelet: EKS vẫn expose được qua node (kubelet chạy trên EC2 worker node,
# không phải control plane AWS quản lý) — để enabled: true (mặc định) là đủ,
# không cần đổi gì.

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3   # EBS CSI Driver phải cài trước (xem comment đầu file)
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 500m, memory: 1Gi }
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - prometheus.techshop.dynv6.net
    paths: ["/"]
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      # PHẢI trùng chính xác group.name ở 3 file Ingress còn lại (xem
      # argo/argocd-server-values-eks.yaml) — gộp chung 1 ALB.
      alb.ingress.kubernetes.io/group.name: techshop-shared

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests: { cpu: 50m, memory: 200Mi }
      limits: { cpu: 200m, memory: 256Mi }
    # Gắn Secret chứa Gmail App Password — PHẢI tạo secret này bằng tay
    # TRƯỚC KHI "helm install/upgrade" (xem scripts/install-eks-tools.sh):
    #   kubectl create secret generic alertmanager-gmail-credentials \
    #     -n monitoring --from-literal=password='<app-password-16-ký-tự>'
    # Chart tự mount vào
    # /etc/alertmanager/secrets/alertmanager-gmail-credentials/password
    # (đúng path "smtp_auth_password_file" bên dưới).
    secrets:
      - alertmanager-gmail-credentials
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - alertmanager.techshop.dynv6.net
    paths: ["/"]
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/group.name: techshop-shared
  config:
    global:
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "REPLACE_ME_GMAIL_GUI@gmail.com"
      smtp_auth_username: "REPLACE_ME_GMAIL_GUI@gmail.com"
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-gmail-credentials/password
      smtp_require_tls: true
    route:
      receiver: "email-notifications"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # BẮT BUỘC — xem giải thích lý do trong
      # docs/prometheus-grafana-alertmanager-monitoring-guide.md mục 5.1
      # (Helm merge "receivers" theo list, THAY THẾ hoàn toàn — không khai
      # "routes: []" sẽ dính lỗi "undefined receiver \"null\"").
      routes: []
    receivers:
      - name: "email-notifications"
        email_configs:
          - to: "REPLACE_ME_NHAN_CANH_BAO@gmail.com"
            send_resolved: true

grafana:
  adminPassword: "changeme-strong-password"   # điền giá trị thật trong file values thật (GITIGNORE)
  persistence:
    enabled: true
    storageClassName: gp3
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - grafana.techshop.dynv6.net
    path: /
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/group.name: techshop-shared
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
