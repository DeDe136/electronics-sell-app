# =============================================================================
# CD PIPELINE — Build & Push Docker images lên Harbor
# -----------------------------------------------------------------------------
# CHỈ chạy sau khi CI (ci.yml) đã hoàn tất trên nhánh main VÀ kết quả là
# "success" — cố ý KHÔNG khai báo thêm trigger "push" song song, vì như vậy
# sẽ chạy 2 lần cho cùng 1 commit (1 lần ngay khi push, không đợi CI; 1 lần
# nữa khi CI xong) và lần chạy đầu có thể push image lên Harbor dù code
# đang fail lint/test/Trivy ở CI. Job này:
#   1) Đăng nhập Harbor bằng robot account (không dùng tài khoản admin)
#   2) Build 2 image (backend, frontend) từ Dockerfile trong docker/
#   3) Tag theo cả SHA commit (rollback dễ) lẫn "latest"
#   4) Push cả 2 tag lên Harbor project "electronics-shop"
#
# Cần khai báo trước ở Settings > Secrets and variables > Actions:
#   HARBOR_REGISTRY     = harbor.yourdomain.com
#   HARBOR_ROBOT_USER    = robot$electronics-shop+ci-cd
#   HARBOR_ROBOT_TOKEN   = <token robot account>
#   NEXT_PUBLIC_API_URL  = URL backend thật (dùng khi build frontend)
# =============================================================================

name: CD - Build & Push Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    name: 🐳 Build & Push to Harbor
    runs-on: ubuntu-latest
    # workflow_dispatch (chạy tay) luôn được phép chạy; còn khi trigger bởi
    # workflow_run (tự động sau CI) thì BẮT BUỘC CI phải "success".
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Trust Harbor self-signed CA
        run: |
          echo "${{ secrets.HARBOR_CA_CERT }}" | base64 -d | sudo tee /usr/local/share/ca-certificates/harbor-ca.crt
          sudo update-ca-certificates
          sudo mkdir -p /etc/docker/certs.d/${{ secrets.HARBOR_REGISTRY }}
          echo "${{ secrets.HARBOR_CA_CERT }}" | base64 -d | sudo tee /etc/docker/certs.d/${{ secrets.HARBOR_REGISTRY }}/ca.crt

      - name: Login vào Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      # Tag theo SHA để có thể rollback về đúng bản build trước đó,
      # tag "latest" để môi trường staging luôn pull bản mới nhất.
      - name: Build & push BACKEND image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/electronics-shop/backend:${{ github.sha }}
            ${{ secrets.HARBOR_REGISTRY }}/electronics-shop/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push FRONTEND image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/electronics-shop/frontend:${{ github.sha }}
            ${{ secrets.HARBOR_REGISTRY }}/electronics-shop/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# -----------------------------------------------------------------------------
# [PLACEHOLDER] Các job tiếp theo, thêm dần khi hạ tầng deploy đã sẵn sàng:
#   2. Deploy to ECS / EC2 / VPS  (SSH vào server, docker compose pull && up -d)
#   3. Run DB migrations          (scripts/migrate.sh)
#   4. Health check
#   5. Notify Slack on success/failure
# -----------------------------------------------------------------------------