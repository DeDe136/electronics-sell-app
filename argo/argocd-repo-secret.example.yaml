# argocd-repo-secret.example.yaml
#
# File MẪU (example) — commit lên Git bình thường, KHÔNG chứa credential thật.
# Copy thành "argocd-repo-secret.yaml" (đã thêm vào .gitignore) rồi điền
# credential thật vào bản copy — chỉ áp dụng nếu repo Git của bạn là PRIVATE
# (repo public không cần bước đăng ký credential này, xem mục 3 trong file
# markdown hướng dẫn).
#
# TÙY CHỌN — chỉ cần dùng nếu bạn muốn đăng ký repo Git private với Argo CD
# bằng "kubectl apply" thay vì bấm "Connect Repo" trên UI (2 cách cho cùng 1
# kết quả, làm 1 trong 2 là đủ, không cần làm cả 2).
#
# Đây là cách Argo CD lưu trữ thông tin repo: 1 Secret thường, có label đặc
# biệt "argocd.argoproj.io/secret-type: repository" để Argo CD tự nhận diện.
#
# CÁCH DÙNG:
#   1. cp argocd-repo-secret.example.yaml argocd-repo-secret.yaml
#   2. Điền đúng username GitHub + Personal Access Token (PAT, quyền Contents:
#      Read-only, xem hướng dẫn tạo PAT trong file markdown đi kèm) vào bản
#      copy "argocd-repo-secret.yaml".
#   3. kubectl apply -f argo/argocd-repo-secret.yaml -n argocd
apiVersion: v1
kind: Secret
metadata:
  name: electronics-shop-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/<username>/<repo-name>.git
  username: "<github-username-cua-ban>"
  password: "<github-personal-access-token>"