# argocd-application.example.yaml
#
# File MẪU (example) — commit lên Git bình thường, KHÔNG chứa credential thật.
# Trước khi dùng, copy thành "argocd-application.yaml" (đã thêm vào
# .gitignore) rồi điền giá trị thật vào bản copy đó — không sửa trực tiếp
# file example này, giữ nguyên placeholder để người khác dùng lại sau.
#
# Bản khai báo (declarative) tương đương với việc bấm "+ New App" trên UI Argo
# CD — dùng khi muốn tạo Application bằng "kubectl apply" thay vì click tay,
# hoặc muốn lưu lại cấu hình này trong Git để tái tạo dễ dàng trên máy khác.
#
# CÁCH DÙNG:
#   1. cp argocd-application.example.yaml argocd-application.yaml
#   2. Sửa các giá trị <...> trong "argocd-application.yaml" (bản copy) cho
#      đúng với Harbor/repo của bạn.
#   3. kubectl apply -f argo/argocd-application.yaml -n argocd
#
# LƯU Ý VỀ FILE BẢN COPY (argocd-application.yaml):
#   - Đừng điền thẳng harborAuth.username/password thật vào "valuesObject"
#     bên dưới rồi commit — phần đó tương đương với việc dán values-dev.yaml
#     vào ô "VALUES" trên UI, chứa credential thật. File bản copy đã nằm
#     trong .gitignore, coi như phiên bản YAML của values-dev.yaml.
#   - Trước khi apply, repo Git PHẢI đã được đăng ký với Argo CD (Settings >
#     Repositories, xem hướng dẫn kèm theo trong file markdown) — Application
#     không tự mang theo credential đọc repo private.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: electronics-shop
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/<username>/<repo-name>.git
    targetRevision: main
    path: helm/electronics-shop
    helm:
      # Tương đương nội dung values-dev.yaml — Argo CD merge đè lên
      # values.yaml mặc định của chart, giống hệt "-f values-dev.yaml" khi
      # chạy "helm upgrade" bằng tay.
      valuesObject:
        image:
          registry: "<IP-hoac-domain-harbor-cua-ban>"
          harborAuth:
            username: "<robot-account-username>"
            password: "<robot-account-token>"

  destination:
    server: https://kubernetes.default.svc
    namespace: electronics-shop

  syncPolicy:
    # Để "syncPolicy: {}" (rỗng) nếu muốn Sync bằng tay lần đầu để kiểm tra
    # trước — đúng cách đã làm trong hướng dẫn ban đầu. Bỏ comment khối
    # "automated" bên dưới khi đã xác nhận app chạy ổn, muốn chuyển hẳn sang
    # tự động (tương đương bật "Automated" + "Self Heal" + "Prune" trên UI).
    #
    # automated:
    #   selfHeal: true   # tự sửa lại nếu cluster bị chỉnh tay lệch khỏi Git
    #   prune: true       # tự xoá resource nếu bị xoá khỏi Git
    syncOptions:
      - CreateNamespace=true

  # Vì backend/frontend dùng HPA (HorizontalPodAutoscaler) để tự scale số
  # Pod, KHÔNG khai "replicas" cố định trong chart nữa khi
  # autoscaling.<service>.enabled=true (xem templates/backend.yaml,
  # templates/frontend.yaml) — nhưng vẫn thêm "ignoreDifferences" ở đây làm
  # lớp phòng vệ thứ 2: dù có lỡ để sót field "replicas" ở đâu đó, Argo CD
  # Self Heal cũng sẽ KHÔNG coi số Pod hiện tại (do HPA điều chỉnh) là "lệch
  # khỏi Git" để tự động kéo về — đây là khuyến nghị chính thức của Argo CD
  # khi dùng chung với HPA.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: frontend
      jsonPointers:
        - /spec/replicas

    # ============================================================
    # BACKEND — 3 KHỐI BÊN DƯỚI CHỈ DÙNG KHI Application này trỏ "path"
    # sang chart "helm/electronics-shop-rollout" (backend chạy bằng Argo
    # Rollouts thay vì Deployment thường).
    #
    # ĐANG DÙNG CHART GỐC "helm/electronics-shop" (KHÔNG dùng Argo
    # Rollouts cho backend)?
    #   => COMMENT LẠI CẢ 3 KHỐI bên dưới (Rollout lẫn 2 Service). Backend
    #      lúc đó vẫn là Deployment "backend" bình thường, không tồn tại
    #      Rollout hay Service "backend-canary" nào để mà ignore — giữ
    #      nguyên các khối này sẽ khiến Argo CD cảnh báo path không khớp
    #      resource nào trên cluster (vô hại nhưng thừa, nên comment cho
    #      sạch).
    # ============================================================

    # -- Khối Rollout: CHỈ GIỮ nếu backend đang dùng Argo Rollouts VÀ vẫn
    # bật HPA (autoscaling.backend.enabled=true) — lúc đó HPA tự sửa
    # "/spec/replicas" của Rollout y hệt cách nó từng sửa của Deployment
    # trước đây, cần ignore để khỏi đánh nhau với Self Heal.
    # Nếu dùng Argo Rollouts NHƯNG KHÔNG dùng HPA cho backend
    # (autoscaling.backend.enabled=false, "replicas" khai cố định thẳng
    # trong chart) => COMMENT LẠI khối này — lúc đó "replicas" trong Git
    # phải là nguồn sự thật duy nhất, cần để Self Heal tự do kéo về đúng
    # Git như bình thường, không ignore.
    - group: argoproj.io
      kind: Rollout
      name: backend
      jsonPointers:
        - /spec/replicas
    
    # frontend Rollout, tương tự như mô tả bên trên của backend Rollout
    - group: argoproj.io
      kind: Rollout
      name: frontend
      jsonPointers:
        - /spec/replicas

    # -- 2 khối Service bên dưới: LUÔN GIỮ khi dùng Argo Rollouts cho
    # backend (không phụ thuộc có bật HPA hay không). Lý do: Argo Rollouts
    # controller luôn tự tiêm thêm label "rollouts-pod-template-hash" vào
    # "spec.selector" của CẢ 2 Service "backend-stable" (stable) và
    # "backend-canary" lúc runtime, để mỗi Service chỉ khớp đúng 1 nhóm Pod
    # dù cả 2 cùng khai "app: backend" trong Git (xem comment giải thích
    # chi tiết trong templates/backend.yaml của chart rollout). Nếu không
    # ignore, Self Heal sẽ liên tục xoá phần hash đó, kéo selector về lại
    # đúng mỗi những gì khai trong Git — khiến cả 2 Service gom chung Pod
    # cũ lẫn Pod mới, traffic canary bị lẫn lộn.
    - group: ""
      kind: Service
      name: backend-stable
      jsonPointers:
        - /spec/selector
    - group: ""
      kind: Service
      name: backend-canary
      jsonPointers:
        - /spec/selector

    # frontend Service, tương tự như mô tả bên trên của backend Service
    - group: ""
      kind: Service
      name: frontend-stable
      jsonPointers:
        - /spec/selector
    - group: ""
      kind: Service
      name: frontend-canary
      jsonPointers:
        - /spec/selector

    - group: traefik.io
      kind: TraefikService
      jsonPointers:
        - /spec/weighted/services/*/weight
    # Cẩn thận cấu hình cho cả apiGroup cũ nếu hệ thống của bạn vẫn dùng song song
    - group: traefik.containo.us
      kind: TraefikService
      jsonPointers:
        - /spec/weighted/services/*/weight